<div class="center-page">
  <div class="container-registro">

    <h1>Registro</h1>

    <input [(ngModel)]="nombre" placeholder="Nombre" [class.invalido]="errorMsg" [class.valido]="nombre && !errorMsg">

    <input [(ngModel)]="apellido" placeholder="Apellido" [class.invalido]="errorMsg"
      [class.valido]="apellido && !errorMsg">

    <input [(ngModel)]="edad" type="number" placeholder="Edad" [class.invalido]="errorMsg"
      [class.valido]="edad && !errorMsg">

    <input [(ngModel)]="email" type="email" placeholder="Correo" [class.invalido]="errorMsg"
      [class.valido]="email && !errorMsg">

    <input [(ngModel)]="password" type="password" placeholder="Contraseña" [class.invalido]="errorMsg"
      [class.valido]="password && !errorMsg">

    <app-modal *ngIf="errorMsg" [mensaje]="errorMsg" (cerrar)="errorMsg = ''">
    </app-modal>


    <button (click)="registrar()" [disabled]="cargando">
      {{ cargando ? 'Registrando...' : 'Registrarse' }}
    </button>

  </div>
</div>
